apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ksc-data
  namespace: ksc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ksc
  namespace: ksc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ksc
  template:
    metadata:
      labels:
        app: ksc
    spec:
      containers:
        - name: ksc
          image: ghcr.io/IrfanPasha05/KSC:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_PATH
              value: /app/data/orders.db
            - name: KSC_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ksc-secrets
                  key: secret-key
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: KAFKA_TOPIC_ORDER_CREATED
              value: ksc.order.created
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ksc-data
---
apiVersion: v1
kind: Service
metadata:
  name: ksc
  namespace: ksc
spec:
  selector:
    app: ksc
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: ksc-secrets
  namespace: ksc
type: Opaque
stringData:
  secret-key: change-me
